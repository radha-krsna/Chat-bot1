<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e6e6fa;
            min-height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            background: #000000;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #1a1a1a;
            padding: 20px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #e6e6fa;
            font-size: 24px;
            font-weight: 700;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .chat-history::-webkit-scrollbar {
            width: 4px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: #333;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: #e6e6fa;
            border-radius: 2px;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            color: #e6e6fa;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        .history-item:hover {
            background: #333;
            transform: translateX(5px);
        }

        .new-chat-btn {
            padding: 15px;
            background: #e6e6fa;
            color: #1a1a1a;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(230, 230, 250, 0.3);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            background: #1a1a1a;
        }

        .chat-header h2 {
            color: #e6e6fa;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e6e6fa;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #333;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #e6e6fa;
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            word-wrap: break-word;
            animation: messageSlideIn 0.5s ease;
            position: relative;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: #e6e6fa;
            color: #1a1a1a;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 20px rgba(230, 230, 250, 0.3);
        }

        .bot-message {
            background: #333;
            color: #e6e6fa;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .input-container {
            padding: 20px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            background: #333;
            border-radius: 25px;
            padding: 10px 20px;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: #e6e6fa;
            box-shadow: 0 0 20px rgba(230, 230, 250, 0.1);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e6e6fa;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            min-height: 20px;
            outline: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: #e6e6fa;
        }

        .send-btn {
            background: #e6e6fa;
            border: none;
            color: #1a1a1a;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(230, 230, 250, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #e6e6fa;
            font-style: italic;
            animation: fadeInOut 1.5s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #e6e6fa;
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .welcome-message {
            text-align: center;
            color: #e6e6fa;
            margin-top: 50px;
        }

        .welcome-message h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .welcome-message p {
            font-size: 16px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .chat-container {
                border-radius: 0;
                height: 100vh;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="floating-particles" id="particles"></div>

    <div class="chat-container">
        <div class="sidebar">
            <div class="logo">
                <h1>AI Assistant</h1>
            </div>

            <div class="chat-history" id="chatHistory">
                <!-- Chat history will be populated here -->
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                ✨ New Chat
            </button>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <h2>
                    <span class="status-indicator"></span>
                    AI Assistant
                </h2>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <h3>Welcome to AI Assistant</h3>
                    <p>I'm here to help you with anything you need. Ask me a question to get started!</p>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        class="message-input"
                        id="messageInput"
                        placeholder="Type your message here..."
                        rows="1"
                        onkeydown="handleKeyPress(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let chatHistory = [];
        let currentChatId = null;

        // Initialize particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Handle key press
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            // Show typing indicator
            showTypingIndicator();

            const aiResponse = await callAIAPI(message);
            hideTypingIndicator();
            addMessage(aiResponse, 'bot');
            updateChatHistory(message);
        }

        // Add message to chat
        function addMessage(content, type) {
            const messagesContainer = document.getElementById('messagesContainer');
            const welcomeMessage = messagesContainer.querySelector('.welcome-message');

            if (welcomeMessage) {
                welcomeMessage.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messageDiv.innerHTML = `
                <div>${content}</div>
                <div class="message-time">${time}</div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Store message
            messages.push({ content, type, time });
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messagesContainer = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '🤖 AI is typing...';
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        async function callAIAPI(message) {
            try {
                const response = await fetch('https://api.pawan.krd/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 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'
                    },
                    body: JSON.stringify({
                        model: "pai-001-light",
                        messages: [{ role: 'user', content: message }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    return data.choices[0].message.content;
                } else {
                    return 'Sorry, I received an unexpected response from the API.';
                }
            } catch (error) {
                console.error('API Error:', error);
                return 'Sorry, I encountered an error. Please try again.';
            }
        }

        // Update chat history
        function updateChatHistory(firstMessage) {
            const historyContainer = document.getElementById('chatHistory');

            if (!currentChatId) {
                currentChatId = Date.now();
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = firstMessage.substring(0, 30) + (firstMessage.length > 30 ? '...' : '');
                historyItem.onclick = () => loadChat(currentChatId);
                historyContainer.appendChild(historyItem);
            }
        }

        // Start new chat
        function startNewChat() {
            messages = [];
            currentChatId = null;
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.innerHTML = `
                <div class="welcome-message">
                    <h3>Welcome to AI Assistant</h3>
                    <p>I'm here to help you with anything you need. Ask me a question to get started!</p>
                </div>
            `;
        }

        // Load chat (placeholder)
        function loadChat(chatId) {
            // This would load a specific chat from storage
            console.log('Loading chat:', chatId);
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();

            // Focus input
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
